name: Nasuha
options:
  bundleIdPrefix: app.nasuha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  NasuhaCore:
    path: Packages/NasuhaCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Nasuha:
    type: application
    platform: iOS
    sources:
      - path: Nasuha
        excludes:
          - "**/*.md"
    dependencies:
      - package: NasuhaCore
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: Nasuha/Info.plist
      properties:
        CFBundleDisplayName: Nasuha
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, bn]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: app.nasuha.ios
            CFBundleURLSchemes: [nasuha]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.nasuha.ios.refill]
        UIAppFonts:
          - AmiriQuran-Regular.ttf
          - HindSiliguri-Regular.ttf
          - HindSiliguri-Medium.ttf
          - HindSiliguri-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nasuha.ios
        PRODUCT_NAME: Nasuha
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  Nasuha:
    build:
      targets:
        Nasuha: all
    test:
      targets:
        - package: NasuhaCore/NasuhaCoreTests
